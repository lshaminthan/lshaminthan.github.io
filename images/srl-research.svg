<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" role="img" aria-label="Semantic role labelling of the Hindi sentence 'Ram ne kitaab padhi' (Ram read the book): Ram is the agent, kitaab is the theme, padhi is the predicate.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3e8ff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#9929fb"/>
    </marker>
    <style>
      .ui { font-family: "Work Sans", "Segoe UI", system-ui, sans-serif; }
      .indic { font-family: "Nirmala UI", "Noto Sans Devanagari", "Mangal", sans-serif; }
    </style>
  </defs>

  <rect width="400" height="460" fill="url(#bg)"/>

  <!-- faint network nodes in the background -->
  <g fill="#9929fb" opacity="0.12">
    <circle cx="40" cy="60" r="4"/><circle cx="80" cy="30" r="3"/><circle cx="350" cy="50" r="4"/>
    <circle cx="370" cy="110" r="3"/><circle cx="30" cy="400" r="3"/><circle cx="365" cy="420" r="4"/>
  </g>
  <g stroke="#9929fb" stroke-width="1" opacity="0.10">
    <path d="M40 60 80 30M350 50 370 110M30 400 60 430M365 420 330 440"/>
  </g>

  <!-- heading -->
  <text x="200" y="52" text-anchor="middle" class="ui" font-size="15" font-weight="600" fill="#9929fb" letter-spacing="1.5">WHO DID WHAT TO WHOM?</text>

  <!-- predicate (the verb) -->
  <rect x="135" y="80" width="130" height="66" rx="14" fill="#9929fb"/>
  <text x="200" y="115" text-anchor="middle" class="indic" font-size="24" font-weight="700" fill="#fff">पढ़ी</text>
  <text x="200" y="135" text-anchor="middle" class="ui" font-size="11" font-weight="600" fill="#f3e8ff" letter-spacing="1">PREDICATE · read</text>

  <!-- arcs from verb to arguments -->
  <path d="M170 146 C 150 190, 110 200, 100 228" fill="none" stroke="#9929fb" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M230 146 C 250 190, 290 200, 300 228" fill="none" stroke="#9929fb" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- agent -->
  <rect x="30" y="234" width="140" height="66" rx="14" fill="#fff" stroke="#f9a8d4" stroke-width="2"/>
  <text x="100" y="268" text-anchor="middle" class="indic" font-size="22" font-weight="700" fill="#132238">राम ने</text>
  <text x="100" y="288" text-anchor="middle" class="ui" font-size="11" font-weight="600" fill="#db2777" letter-spacing="1">AGENT · Ram</text>

  <!-- theme -->
  <rect x="230" y="234" width="140" height="66" rx="14" fill="#fff" stroke="#6ee7b7" stroke-width="2"/>
  <text x="300" y="268" text-anchor="middle" class="indic" font-size="22" font-weight="700" fill="#132238">किताब</text>
  <text x="300" y="288" text-anchor="middle" class="ui" font-size="11" font-weight="600" fill="#059669" letter-spacing="1">THEME · book</text>

  <!-- sentence -->
  <rect x="30" y="330" width="340" height="90" rx="14" fill="#fff" opacity="0.85"/>
  <text x="200" y="368" text-anchor="middle" class="indic" font-size="22" fill="#132238">
    <tspan fill="#db2777" font-weight="700">राम ने</tspan>
    <tspan fill="#059669" font-weight="700">किताब</tspan>
    <tspan fill="#9929fb" font-weight="700">पढ़ी</tspan>
  </text>
  <text x="200" y="398" text-anchor="middle" class="ui" font-size="13" fill="#697482" font-style="italic">"Ram read the book" (Hindi, verb at the end)</text>
</svg>
